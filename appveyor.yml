version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

install:
  - cmd: git submodule update --init --recursive

  # --- INSTALL NASM (manual, reliable) ---
  - ps: |
      Invoke-WebRequest https://www.nasm.us/pub/nasm/releasebuilds/2.16.01/win64/nasm-2.16.01-win64.zip -OutFile nasm.zip
      Expand-Archive nasm.zip -DestinationPath C:\tools\nasm
      $nasmDir = Get-ChildItem C:\tools\nasm | Select-Object -First 1
      $env:PATH = "$($nasmDir.FullName);$env:PATH"
      [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")

  # Verify NASM
  - cmd: where nasm
  - cmd: nasm -v

  # --- INSTALL YASM ---
  - ps: |
      Invoke-WebRequest https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe -OutFile yasm.exe
      New-Item -ItemType Directory -Force -Path C:\tools\yasm
      Move-Item yasm.exe C:\tools\yasm\yasm.exe
      $env:PATH = "C:\tools\yasm;$env:PATH"
      [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")

  # Verify YASM
  - cmd: where yasm
  - cmd: yasm --version

build_script:
  # Build dependencies (FFmpeg etc.)
  - cmd: cd src\thirdparty
  - cmd: build.bat x64 Release

  # Build MPC-HC
  - cmd: cd ..\..
  - cmd: build.bat Build x64 Release
