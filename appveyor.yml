version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

install:
  # Get submodules
  - cmd: git submodule update --init --recursive

  # Install NASM via Chocolatey
  - cmd: choco install nasm -y

  # Refresh environment so NASM is immediately available
  - cmd: refreshenv

  # Verify NASM is accessible
  - cmd: where nasm
  - cmd: nasm -v

  # Install YASM manually (Chocolatey package is broken)
  - ps: |
      Invoke-WebRequest https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe -OutFile yasm.exe
      New-Item -ItemType Directory -Force -Path C:\yasm
      Move-Item yasm.exe C:\yasm\yasm.exe

      # Add to PATH for current session + persist
      $env:PATH = "C:\yasm;$env:PATH"
      [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")

  # Verify YASM is accessible
  - cmd: where yasm
  - cmd: yasm --version

build_script:
  - cmd: build.bat Build x64 Release
