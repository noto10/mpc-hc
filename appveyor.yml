version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

install:
  # Get submodules
  - cmd: git submodule update --init --recursive

  # Install NASM (Chocolatey handles PATH correctly after refreshenv)
  - cmd: choco install nasm -y
  - cmd: refreshenv

  # Verify NASM
  - cmd: where nasm
  - cmd: nasm -v

  # Install YASM (manual, simple + reliable)
  - ps: |
      Invoke-WebRequest https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe -OutFile yasm.exe
      New-Item -ItemType Directory -Force -Path C:\tools\yasm
      Move-Item yasm.exe C:\tools\yasm\yasm.exe
      $env:PATH = "C:\tools\yasm;$env:PATH"
      [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")

  # Verify YASM
  - cmd: where yasm
  - cmd: yasm --version

build_script:
  # --- BUILD THIRD-PARTY LIBS (CRITICAL STEP) ---
  - cmd: cd src\thirdparty
  - cmd: build.bat x64 Release

  # --- BUILD MAIN PROJECT ---
  - cmd: cd ..\..
  - cmd: build.bat Build x64 Release
