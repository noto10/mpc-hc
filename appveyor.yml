version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

clone_depth: 1

install:
  - cmd: git submodule update --init --recursive

build_script:
  - cmd: msbuild mpc-hc.sln ^
        /p:Configuration=Release ^
        /p:Platform=x64 ^
        /p:UseLibass=false ^
        /p:UseHarfbuzz=false ^
        /p:UseFreetype=false ^
        /t:mpc-hc

artifacts:
  - path: bin\*
