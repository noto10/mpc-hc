version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

install:
  - cmd: git submodule update --init --recursive

  # Install NASM
  - cmd: choco install nasm -y

  # 🔍 Get actual install path from Chocolatey (reliable)
  - ps: |
      $pkg = choco list --local-only --exact nasm | Select-String "nasm"
      if (-not $pkg) { throw "NASM package not found" }

      $nasmExe = Get-ChildItem "C:\Program Files\NASM" -Filter nasm.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

      if (-not $nasmExe) {
          throw "NASM exe not found in expected location"
      }

      $nasmDir = $nasmExe.DirectoryName
      Write-Host "NASM found at $nasmDir"

      $env:PATH = "$nasmDir;$env:PATH"
      [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")

  # Verify NASM
  - cmd: where nasm
  - cmd: nasm -v

  # Install YASM
  - ps: |
      Invoke-WebRequest https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe -OutFile yasm.exe
      New-Item -ItemType Directory -Force -Path C:\yasm
      Move-Item yasm.exe C:\yasm\yasm.exe

      $env:PATH = "C:\yasm;$env:PATH"
      [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")

  - cmd: where yasm
  - cmd: yasm --version

build_script:
  - cmd: build.bat Build x64 Release
