version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

install:
  # Submodules
  - cmd: git submodule update --init --recursive

  # Install NASM
  - cmd: choco install nasm -y

  # Force-detect NASM location and add to PATH
  - ps: |
      $nasm = Get-ChildItem -Recurse "C:\ProgramData\chocolatey" -Filter nasm.exe | Select-Object -First 1
      if (-not $nasm) { throw "NASM not found after install" }

      $nasmDir = $nasm.DirectoryName
      Write-Host "NASM found at $nasmDir"

      $env:PATH = "$nasmDir;$env:PATH"
      [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")

  # Verify NASM
  - cmd: where nasm
  - cmd: nasm -v

  # Install YASM manually
  - ps: |
      Invoke-WebRequest https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe -OutFile yasm.exe
      New-Item -ItemType Directory -Force -Path C:\yasm
      Move-Item yasm.exe C:\yasm\yasm.exe

      $env:PATH = "C:\yasm;$env:PATH"
      [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")

  # Verify YASM
  - cmd: where yasm
  - cmd: yasm --version

build_script:
  - cmd: build.bat Build x64 Release
