version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

clone_depth: 1

install:
  # --- Submodules ---
  - cmd: git submodule update --init --recursive

  # --- Provide minimal fallback libs (ONLY if missing) ---
  - ps: |
      $ErrorActionPreference = "Stop"

      $libPath = "C:\projects\mpc-hc\bin\lib\Release_x64"
      New-Item -ItemType Directory -Force -Path $libPath | Out-Null

      if (!(Test-Path "$libPath\ffmpeg.lib")) {
          Write-Host "ffmpeg.lib missing → injecting fallback build"

          # lightweight fallback (prepacked libs repo)
          git clone https://github.com/shiftmedia/ffmpeg-builds temp_ffmpeg

          Copy-Item temp_ffmpeg\lib\*.lib $libPath -Recurse -ErrorAction SilentlyContinue

          if (!(Test-Path "$libPath\ffmpeg.lib")) {
              Write-Error "ffmpeg.lib still missing after fallback!"
          }
      }
      else {
          Write-Host "ffmpeg.lib already present"
      }

build_script:
  - cmd: build.bat Clean
  - cmd: build.bat Release x64

artifacts:
  - path: bin\*
