version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

clone_depth: 1

install:
  # --- Get submodules ---
  - cmd: git submodule update --init --recursive

  # --- Download official MPC-HC prebuilt deps ---
  - ps: |
      $ErrorActionPreference = "Stop"

      $url = "https://github.com/clsid2/mpc-hc/releases/download/2.0.0/mpc-hc-deps-x64.zip"
      $out = "deps.zip"

      Write-Host "Downloading deps..."
      Invoke-WebRequest $url -OutFile $out

      Expand-Archive $out -DestinationPath C:\deps

      # Ensure target directory exists
      New-Item -ItemType Directory -Force -Path C:\projects\mpc-hc\bin\lib\Release_x64 | Out-Null

      # Copy all libs (includes ffmpeg.lib)
      Copy-Item C:\deps\lib\*.lib C:\projects\mpc-hc\bin\lib\Release_x64\ -Recurse

      Write-Host "Dependencies installed"

  # --- Sanity check ---
  - cmd: dir C:\projects\mpc-hc\bin\lib\Release_x64

build_script:
  # --- Clean + build ---
  - cmd: build.bat Clean
  - cmd: build.bat Release x64

artifacts:
  - path: bin\*
