version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

clone_depth: 1

install:
  # --- Get submodules ---
  - cmd: git submodule update --init --recursive

  # --- Install NASM ---
  - ps: |
      $ErrorActionPreference = "Stop"

      Invoke-WebRequest https://www.nasm.us/pub/nasm/releasebuilds/2.16.01/win64/nasm-2.16.01-win64.zip -OutFile nasm.zip
      Expand-Archive nasm.zip -DestinationPath C:\tools\nasm

      $nasmDir = (Get-ChildItem C:\tools\nasm | Select-Object -First 1).FullName
      $env:PATH = "$nasmDir;$env:PATH"

      Write-Host "NASM path: $nasmDir"

  - cmd: where nasm
  - cmd: nasm -v

  # --- Install YASM ---
  - ps: |
      $ErrorActionPreference = "Stop"

      Invoke-WebRequest https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe -OutFile yasm.exe

      New-Item -ItemType Directory -Force -Path C:\tools\yasm | Out-Null
      Move-Item yasm.exe C:\tools\yasm\yasm.exe

      $env:PATH = "C:\tools\yasm;$env:PATH"

      Write-Host "YASM installed"

  - cmd: where yasm
  - cmd: yasm --version

  # --- Install proper MinGW (REQUIRED for LAVFilters / FFmpeg) ---
  - ps: |
      $ErrorActionPreference = "Stop"

      Invoke-WebRequest https://github.com/brechtsanders/winlibs_mingw/releases/download/12.2.0-16.0.0-10.0.0-ucrt-r5/winlibs-x86_64-posix-seh-gcc-12.2.0-llvm-16.0.0-mingw-w64ucrt-10.0.0-r5.7z -OutFile mingw.7z

      7z x mingw.7z -oC:\tools\mingw | Out-Null

      $mingwRoot = Get-ChildItem C:\tools\mingw | Select-Object -First 1
      $binPath = Join-Path $mingwRoot.FullName "mingw64\bin"

      $env:PATH = "$binPath;$env:PATH"

      Write-Host "MinGW bin: $binPath"

  # --- Verify MinGW (FAIL EARLY if broken) ---
  - cmd: where x86_64-w64-mingw32-gcc
  - cmd: x86_64-w64-mingw32-gcc --version

build_script:
  # --- Build LAVFilters (this builds FFmpeg correctly) ---
  - cmd: cd src\thirdparty\LAVFilters
  - cmd: build_lavfilters.bat

  # --- Return to root ---
  - cmd: cd ..\..\..

  # --- Build MPC-HC ---
  - cmd: build.bat Clean
  - cmd: build.bat Release x64

artifacts:
  - path: bin\*
