version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

clone_depth: 1

install:
  - cmd: git submodule update --init --recursive

  # --- Create dummy FFmpeg libs so linker is satisfied ---
  - ps: |
      $ErrorActionPreference = "Stop"

      $libDir = "C:\projects\mpc-hc\bin\lib\Release_x64"
      New-Item -ItemType Directory -Force -Path $libDir | Out-Null

      $libs = @(
        "avcodec.lib",
        "avformat.lib",
        "avutil.lib",
        "swscale.lib",
        "swresample.lib",
        "postproc.lib"
      )

      foreach ($lib in $libs) {
        $path = Join-Path $libDir $lib
        if (!(Test-Path $path)) {
          New-Item -ItemType File -Path $path | Out-Null
        }
      }

      Write-Host "Stub FFmpeg libs created"

build_script:
  - cmd: msbuild mpc-hc.sln /p:Configuration=Release /p:Platform=x64

artifacts:
  - path: bin\*
