version: 1.0.{build}

image: Visual Studio 2022

configuration: Release
platform: x64

clone_depth: 1

install:
  # --- Submodules ---
  - cmd: git submodule update --init --recursive

  # --- NASM ---
  - ps: |
      $ErrorActionPreference = "Stop"

      Invoke-WebRequest https://www.nasm.us/pub/nasm/releasebuilds/2.16.01/win64/nasm-2.16.01-win64.zip -OutFile nasm.zip
      Expand-Archive nasm.zip -DestinationPath C:\tools\nasm

      $nasmDir = (Get-ChildItem C:\tools\nasm | Select-Object -First 1).FullName
      $env:PATH = "$nasmDir;$env:PATH"

      Write-Host "NASM path: $nasmDir"

  - cmd: where nasm
  - cmd: nasm -v

  # --- YASM ---
  - ps: |
      $ErrorActionPreference = "Stop"

      Invoke-WebRequest https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe -OutFile yasm.exe

      New-Item -ItemType Directory -Force -Path C:\tools\yasm | Out-Null
      Move-Item yasm.exe C:\tools\yasm\yasm.exe

      $env:PATH = "C:\tools\yasm;$env:PATH"

      Write-Host "YASM installed"

  - cmd: where yasm
  - cmd: yasm --version

  # --- Prebuilt dependencies (includes FFmpeg libs) ---
  - ps: |
      $ErrorActionPreference = "Stop"

      Invoke-WebRequest https://github.com/clsid2/mpc-hc/releases/download/1.9.24/mpc-hc-deps-x64.zip -OutFile deps.zip

      Expand-Archive deps.zip -DestinationPath C:\deps

      New-Item -ItemType Directory -Force -Path C:\projects\mpc-hc\bin\lib\Release_x64 | Out-Null

      Copy-Item C:\deps\lib\*.lib C:\projects\mpc-hc\bin\lib\Release_x64\ -Recurse

      Write-Host "Dependencies installed"

build_script:
  # --- Build MPC-HC ---
  - cmd: build.bat Build x64 Release

artifacts:
  - path: bin\*
