name: Build MPC-HC

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # =========================================================
      # Install Windows SDK 8.1
      # =========================================================
      - name: Install Windows SDK 8.1
        shell: pwsh
        run: |
          choco install windows-sdk-8.1 -y

      # =========================================================
      # Setup MSYS2 / MinGW
      #
      # CRITICAL:
      # path-type:minimal prevents runaway PATH expansion
      # =========================================================
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-pkg-config
            make
            yasm
            nasm
            diffutils

      # =========================================================
      # Create MPC-HC build overrides
      # =========================================================
      - name: Create build.user.bat
        shell: cmd
        run: |
          (
            echo SET MPCHC_MINGW64=C:\msys64\mingw64
            echo SET MPCHC_GIT=C:\Program Files\Git
          ) > build.user.bat

      # =========================================================
      # Main Build
      # =========================================================
      - name: Build Release x64
        shell: cmd
        run: |
          REM ==================================================
          REM Short repository path
          REM ==================================================
          subst Z: "%GITHUB_WORKSPACE%"

          REM ==================================================
          REM Preserve MSYS activation semantics
          REM ==================================================
          set MSYSTEM=MINGW64
          set CHERE_INVOKING=1

          REM ==================================================
          REM HARD CLEAN PATH
          REM
          REM IMPORTANT:
          REM DO NOT include:
          REM   C:\msys64\usr\bin
          REM   Git\usr\bin
          REM
          REM Those break legacy batch parsing and trigger:
          REM   "The input line is too long"
          REM   ". was unexpected at this time."
          REM ==================================================
          set "PATH=C:\Windows\system32"
          set "PATH=%PATH%;C:\Windows"
          set "PATH=%PATH%;C:\Windows\System32\WindowsPowerShell\v1.0"
          set "PATH=%PATH%;C:\Program Files\PowerShell\7"

          REM ==================================================
          REM Load Visual Studio environment
          REM ==================================================
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          REM ==================================================
          REM Force SDK 8.1
          REM ==================================================
          set "WindowsSDKVersion=8.1\"
          set "WindowsSdkDir=C:\Program Files (x86)\Windows Kits\8.1\"

          REM ==================================================
          REM Ensure MSVC tools take precedence
          REM ==================================================
          set "PATH=%VCToolsInstallDir%bin\Hostx64\x64;%PATH%"

          REM ==================================================
          REM Add ONLY required non-MSVC tools
          REM ==================================================
          set "PATH=%PATH%;C:\Program Files\Git\bin"
          set "PATH=%PATH%;C:\msys64\mingw64\bin"

          REM ==================================================
          REM Remove dangerous PATH pollution
          REM ==================================================
          set "PATH=%PATH:C:\msys64\usr\bin;=%"
          set "PATH=%PATH:C:\Program Files\Git\usr\bin;=%"
          set "PATH=%PATH:C:\Strawberry\perl\bin;=%"

          REM ==================================================
          REM Diagnostics
          REM ==================================================
          echo ======================================
          echo PATH LENGTH:
          powershell -NoProfile -Command "$env:PATH.Length"
          echo ======================================

          echo.
          echo ==== TOOL LOCATIONS ====
          where cl
          where link
          where gcc
          where x86_64-w64-mingw32-gcc
          where yasm
          where nasm
          echo ========================
          echo.

          REM ==================================================
          REM Validate SDK
          REM ==================================================
          if not exist "C:\Program Files (x86)\Windows Kits\8.1\Include" (
            echo ERROR: Windows SDK 8.1 missing
            exit /b 1
          )

          REM ==================================================
          REM Build
          REM ==================================================
          cd /d Z:\

          call build.bat release x64

      # =========================================================
      # Upload artifacts
      # =========================================================
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-x64
          path: |
            Z:\bin\mpc-hc_x64\
