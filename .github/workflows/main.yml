name: Build MPC-HC (Patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Visual Studio Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install YASM
      run: choco install yasm -y

    - name: Install Windows SDK 8.1
      run: choco install windows-sdk-8.1 -y

    - name: Setup MSYS2 & MinGW64
      uses: msys2/setup-msys2@v2
      with:
        install: mingw-w64-x86_64-gcc
        cache: true
        update: false

    - name: Configure MinGW PATH & Environment
      run: |
        # FIX 1: Add MinGW binaries to Windows PATH so batch scripts can find gcc.exe
        echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
        # FIX 2: Set required env var for MPC-HC build system
        echo "MPCHC_MINGW64=C:\msys64\mingw64" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Build Release x64
      run: |
        # FIX 3: Map repo to Z: drive to bypass Windows CMD 8191-char limit (LAVFilters)
        subst Z: .
        cd /d Z:\
        call build.bat release x64
      shell: cmd

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MPC-HC-Patched-x64
        path: Z:\bin\mpc-hc_x64\
      if: success()