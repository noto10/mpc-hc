name: Build MPC-HC (Patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Install required assembler
      - name: Install YASM
        shell: pwsh
        run: |
          choco install yasm -y

      # Required by older MPC-HC project files
      - name: Install Windows SDK 8.1
        shell: pwsh
        run: |
          choco install windows-sdk-8.1 -y

      # Setup MSYS2 / MinGW
      - name: Setup MSYS2 & MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            yasm
            nasm
            diffutils

      # Configure MPC-HC-specific environment
      - name: Configure Build Environment
        shell: pwsh
        run: |
          # Environment variables used by MPC-HC scripts
          echo "MPCHC_MINGW64=C:\msys64\mingw64" >> $env:GITHUB_ENV
          echo "MPCHC_GIT=C:\Program Files\Git" >> $env:GITHUB_ENV

          # Create build.user.bat
          @"
          SET MPCHC_MINGW64=C:\msys64\mingw64
          SET MPCHC_GIT=C:\Program Files\Git
          "@ | Out-File -FilePath build.user.bat -Encoding ASCII

      # MAIN FIX:
      # - Removes PATH overflow
      # - Avoids cmd.exe parser corruption
      # - Prevents ffmpeg.bat / LAVFilters failures
      - name: Build Release x64
        shell: cmd
        run: |
          REM Shorten working path
          subst Z: .

          REM Completely reset PATH
          set "PATH=C:\Windows\system32;C:\Windows"

          REM Load Visual Studio build tools ONLY ONCE
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          REM Add only the tools actually needed
          set "PATH=%PATH%;C:\Program Files\Git\bin"
          set "PATH=%PATH%;C:\Program Files\Git\usr\bin"
          set "PATH=%PATH%;C:\msys64\usr\bin"
          set "PATH=%PATH%;C:\msys64\mingw64\bin"

          REM Optional debugging
          echo ==== PATH LENGTH ====
          powershell -NoProfile -Command "$env:PATH.Length"

          echo ==== BUILD START ====

          cd /d Z:\

          call build.bat release x64

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-Patched-x64
          path: Z:\bin\mpc-hc_x64\
