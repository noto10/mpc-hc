name: Build MPC-HC

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      #
      # MSYS2 / MinGW setup
      #
      # path-type:minimal is critical:
      # it prevents PATH explosion on Windows runners
      #
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            yasm
            nasm
            diffutils

      #
      # MPC-HC custom environment
      #
      - name: Create build.user.bat
        shell: cmd
        run: |
          (
            echo SET MPCHC_MINGW64=C:\msys64\mingw64
            echo SET MPCHC_GIT=C:\Program Files\Git
          ) > build.user.bat

      #
      # Main build step
      #
      # Fixes:
      # - cmd.exe PATH overflow
      # - batch parser corruption
      # - ffmpeg.bat failures
      # - LAVFilters build failures
      # - PowerShell missing after PATH reset
      #
      - name: Build Release x64
        shell: cmd
        run: |
          REM =====================================
          REM Short working path
          REM =====================================
          subst Z: .

          REM =====================================
          REM HARD RESET PATH
          REM Keep only essential Windows paths
          REM =====================================
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"

          REM =====================================
          REM Add PowerShell 7
          REM =====================================
          set "PATH=%PATH%;C:\Program Files\PowerShell\7"

          REM =====================================
          REM Load Visual Studio environment ONCE
          REM =====================================
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          REM =====================================
          REM Add only required tools
          REM =====================================
          set "PATH=%PATH%;C:\Program Files\Git\bin"
          set "PATH=%PATH%;C:\Program Files\Git\usr\bin"
          set "PATH=%PATH%;C:\msys64\usr\bin"
          set "PATH=%PATH%;C:\msys64\mingw64\bin"

          REM =====================================
          REM Debugging info
          REM =====================================
          echo ======================================
          echo PATH LENGTH:
          powershell -NoProfile -Command "$env:PATH.Length"
          echo ======================================

          where cl
          where link
          where gcc
          where yasm
          where powershell
          where pwsh

          REM =====================================
          REM Start build
          REM =====================================
          cd /d Z:\

          call build.bat release x64

      #
      # Upload artifacts
      #
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-x64
          path: |
            Z:\bin\mpc-hc_x64\
