name: Build MPC-HC

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      #
      # Checkout source
      #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      #
      # Install Windows SDK 8.1
      #
      # Required by legacy MPC-HC build scripts
      #
      - name: Install Windows SDK 8.1
        shell: pwsh
        run: |
          choco install windows-sdk-8.1 -y

      #
      # Setup MSYS2 / MinGW
      #
      # path-type:minimal avoids catastrophic PATH growth
      #
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            make
            yasm
            nasm
            diffutils

      #
      # Create MPC-HC environment overrides
      #
      - name: Create build.user.bat
        shell: cmd
        run: |
          (
            echo SET MPCHC_MINGW64=C:\msys64\mingw64
            echo SET MPCHC_GIT=C:\Program Files\Git
          ) > build.user.bat

      #
      # Main build
      #
      - name: Build Release x64
        shell: cmd
        run: |
          REM ==================================================
          REM Short repository path
          REM ==================================================
          subst Z: "%GITHUB_WORKSPACE%"

          REM ==================================================
          REM Preserve MSYS2 integration
          REM ==================================================
          set MSYSTEM=MINGW64
          set CHERE_INVOKING=1

          REM ==================================================
          REM Load Visual Studio environment
          REM ==================================================
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          REM ==================================================
          REM Force Windows SDK 8.1
          REM ==================================================
          set "WindowsSDKVersion=8.1\"
          set "WindowsSdkDir=C:\Program Files (x86)\Windows Kits\8.1\"

          REM ==================================================
          REM Reduce only known PATH bloat
          REM Do NOT fully reset PATH
          REM ==================================================
          set "PATH=%PATH:C:\Strawberry\perl\bin;=%"

          REM ==================================================
          REM Ensure MinGW tools are reachable
          REM ==================================================
          set "PATH=C:\msys64\mingw64\bin;%PATH%"

          REM ==================================================
          REM Ensure MSVC linker precedes GNU link.exe
          REM ==================================================
          set "PATH=%VCToolsInstallDir%bin\Hostx64\x64;%PATH%"

          REM ==================================================
          REM Debugging output
          REM ==================================================
          echo ======================================
          echo PATH LENGTH:
          powershell -NoProfile -Command "$env:PATH.Length"
          echo ======================================

          echo.
          echo ==== TOOL LOCATIONS ====
          where gcc
          where x86_64-w64-mingw32-gcc
          where yasm
          where nasm
          where cl
          where link
          where powershell
          where pwsh
          echo ========================
          echo.

          REM ==================================================
          REM Validate SDK 8.1 presence
          REM ==================================================
          if not exist "C:\Program Files (x86)\Windows Kits\8.1\Include" (
            echo ERROR: Windows SDK 8.1 Include directory missing
            exit /b 1
          )

          REM ==================================================
          REM Build
          REM ==================================================
          cd /d Z:\

          call build.bat release x64

      #
      # Upload artifacts
      #
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-x64
          path: |
            Z:\bin\mpc-hc_x64\
