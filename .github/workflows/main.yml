name: Build MPC-HC (Patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Visual Studio Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install YASM
      run: choco install yasm -y

    # 🔧 FIX 1: Install Windows SDK 8.1 (Required by MPC-HC project files)
    - name: Install Windows SDK 8.1
      run: choco install windows-sdk-8.1 -y

    # 🔧 FIX 2: Setup MSYS2 & MinGW64
    - name: Setup MSYS2 & MinGW64
      uses: msys2/setup-msys2@v2
      with:
        install: mingw-w64-x86_64-gcc
        cache: true
        update: false

    # 🔧 FIX 3: Configure Environment Safely (Avoids PATH corruption)
    - name: Configure Build Environment
      run: |
        # Set variables for MPC-HC build scripts
        echo "MPCHC_MINGW64=C:\msys64\mingw64" >> $env:GITHUB_ENV
        echo "MPCHC_GIT=C:\Program Files\Git" >> $env:GITHUB_ENV
        
        # Add MinGW and Git Bash to PATH using GitHub's native method
        echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
        echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        
        # Create a clean build.user.bat WITHOUT modifying PATH
        @"
        SET MPCHC_MINGW64=C:\msys64\mingw64
        SET MPCHC_GIT=C:\Program Files\Git
        "@ | Out-File -FilePath build.user.bat -Encoding ASCII
      shell: pwsh

    # 🔧 FIX 4: Map to Z: drive (Prevents "Input line too long" in LAVFilters)
    - name: Build Release x64
      run: |
        subst Z: .
        cd /d Z:\
        call build.bat release x64
      shell: cmd

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MPC-HC-Patched-x64
        path: Z:\bin\mpc-hc_x64\
      if: success()
