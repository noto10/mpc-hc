name: Build MPC-HC

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      #
      # Checkout repository
      #
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      #
      # Install Windows SDK 8.1
      #
      # Required by older MPC-HC build scripts
      #
      - name: Install Windows SDK 8.1
        shell: pwsh
        run: |
          choco install windows-sdk-8.1 -y

      #
      # Setup MSYS2 / MinGW
      #
      # path-type:minimal is critical:
      # it avoids PATH explosion on Windows runners
      #
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            yasm
            nasm
            diffutils

      #
      # Create MPC-HC environment file
      #
      - name: Create build.user.bat
        shell: cmd
        run: |
          (
            echo SET MPCHC_MINGW64=C:\msys64\mingw64
            echo SET MPCHC_GIT=C:\Program Files\Git
          ) > build.user.bat

      #
      # Main build
      #
      - name: Build Release x64
        shell: cmd
        run: |
          REM ==========================================
          REM Map repository to short drive path
          REM ==========================================
          subst Z: "%GITHUB_WORKSPACE%"

          REM ==========================================
          REM HARD RESET PATH
          REM Prevent Windows cmd overflow
          REM ==========================================
          set "PATH=C:\Windows\system32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"

          REM ==========================================
          REM Add PowerShell 7
          REM ==========================================
          set "PATH=%PATH%;C:\Program Files\PowerShell\7"

          REM ==========================================
          REM Load Visual Studio environment
          REM ==========================================
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64

          REM ==========================================
          REM Force Windows SDK 8.1
          REM ==========================================
          set "WindowsSDKVersion=8.1\"
          set "WindowsSdkDir=C:\Program Files (x86)\Windows Kits\8.1\"

          REM ==========================================
          REM Add ONLY required tools
          REM Avoid GNU link.exe collisions
          REM ==========================================
          set "PATH=%PATH%;C:\Program Files\Git\bin"
          set "PATH=%PATH%;C:\msys64\mingw64\bin"

          REM ==========================================
          REM Debugging
          REM ==========================================
          echo ======================================
          echo PATH LENGTH:
          powershell -NoProfile -Command "$env:PATH.Length"
          echo ======================================

          echo.
          echo ==== TOOL LOCATIONS ====
          where cl
          where link
          where gcc
          where yasm
          where powershell
          where pwsh
          echo ========================
          echo.

          REM ==========================================
          REM Verify SDK 8.1 exists
          REM ==========================================
          if not exist "C:\Program Files (x86)\Windows Kits\8.1\Include" (
            echo ERROR: Windows SDK 8.1 Include directory missing
            exit /b 1
          )

          REM ==========================================
          REM Start build
          REM ==========================================
          cd /d Z:\

          call build.bat release x64

      #
      # Upload artifacts
      #
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-x64
          path: |
            Z:\bin\mpc-hc_x64\
