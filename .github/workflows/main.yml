name: Build MPC-HC (Patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Visual Studio Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install YASM
      run: choco install yasm -y

    # 1. Setup MSYS2 (Provides GCC for FFmpeg/LAVFilters)
    - name: Setup MSYS2 & MinGW64
      uses: msys2/setup-msys2@v2
      with:
        install: mingw-w64-x86_64-gcc
        cache: true
        update: false

    # 2. Create build.user.bat
    # This file is explicitly called by MPC-HC build scripts to set paths.
    # This ensures MPCHC_MINGW64 and PATH are set for ALL batch scripts.
    - name: Create build.user.bat
      run: |
        echo "SET MPCHC_MINGW64=C:\msys64\mingw64" > build.user.bat
        echo "SET PATH=C:\msys64\mingw64\bin;%%PATH%%" >> build.user.bat
        type build.user.bat

    # 3. Map drive to Z: to bypass Windows CMD 8191-char limit
    - name: Map Drive and Build
      run: |
        subst Z: .
        cd /d Z:\
        call build.bat release x64
      shell: cmd

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MPC-HC-Patched-x64
        path: bin/mpc-hc_x64/
      if: success()
