name: Build MPC-HC (Patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Visual Studio Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install YASM
      run: choco install yasm -y

    - name: Setup MSYS2 & MinGW64
      uses: msys2/setup-msys2@v2
      with:
        install: mingw-w64-x86_64-gcc
        cache: true
        update: false

    # 🔧 CRITICAL FIX: Fully configure environment for MPC-HC batch scripts
    - name: Configure Build Environment
      run: |
        # Set variables for GitHub Actions runner
        echo "MPCHC_MINGW64=C:\msys64\mingw64" >> $env:GITHUB_ENV
        echo "MPCHC_MSYS=C:\msys64" >> $env:GITHUB_ENV
        echo "MPCHC_GIT=C:\Program Files\Git" >> $env:GITHUB_ENV
        
        # Add MinGW and Git Bash to PATH for the runner
        echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
        echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        
        # Create build.user.bat with explicit PATH expansion for MSBuild NMake steps
        @"
        SET MPCHC_MINGW64=C:\msys64\mingw64
        SET MPCHC_MSYS=C:\msys64
        SET MPCHC_GIT=C:\Program Files\Git
        SET PATH=C:\msys64\mingw64\bin;%%PATH%%
        "@ | Out-File -FilePath build.user.bat -Encoding ASCII
        
        Write-Host "Generated build.user.bat:"
        Get-Content build.user.bat
      shell: pwsh

    - name: Build Release x64
      run: |
        # Map to Z: to bypass Windows CMD 8191-character limit for LAVFilters
        subst Z: .
        cd /d Z:\
        call build.bat release x64
      shell: cmd

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MPC-HC-Patched-x64
        path: Z:\bin\mpc-hc_x64\
      if: success()
